<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QnA AI Chatbot</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 400px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 15px #ccc;
            overflow: hidden;
        }

        .header {
            background: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        #chat {
            height: 400px;
            padding: 15px;
            overflow-y: auto;
        }

        .user {
            text-align: right;
            margin: 10px;
        }

        .bot {
            text-align: left;
            margin: 10px;
        }

        .message {
            padding: 10px;
            border-radius: 8px;
            display: inline-block;
            max-width: 80%;
        }

        .user .message {
            background: #d1e7ff;
        }

        .bot .message {
            background: #eeeeee;
        }

        .input-area {
            display: flex;
            padding: 10px;
        }

        input {
            flex: 1;
            padding: 10px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

    </style>

</head>

<body>

<div class="chat-container">

    <div class="header">
        <h2>QnA AI Chatbot</h2>
    </div>

    <div id="chat"></div>

    <div class="input-area">

        <input
            type="text"
            id="message"
            placeholder="Ask your question..."
        >

        <button onclick="sendMessage()">
            Send
        </button>

    </div>

</div>

<script>

async function sendMessage() {

    const input = document.getElementById("message");

    const message = input.value.trim();

    if (!message) {
        return;
    }

    addMessage(message, "user");

    input.value = "";

    const response = await fetch("/api/chat", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            message: message
        })

    });

    const data = await response.json();

    addMessage(data.answer, "bot");
}


function addMessage(message, sender) {

    const chat = document.getElementById("chat");

    const div = document.createElement("div");

    div.className = sender;

    div.innerHTML = `
        <span class="message">
            ${message}
        </span>
    `;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;
}

</script>

</body>

</html>
